<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<link rel="icon" href="data:,"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Live Agent — Max & Mia</title>
<link rel="stylesheet" href="style.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Agentic Cartoon <span>LIVE</span></h1>
    <div class="stage" id="stage">
      <div class="cast" id="cast">
      <div class="char" id="char">
        <div class="shadow"></div>
        <div class="leg left"></div><div class="leg right"></div>
        <div class="body">
          <div class="arms">
            <div class="arm left" id="armL"><div class="hand"></div></div>
            <div class="arm right" id="armR"><div class="hand"></div></div>
          </div>
        </div>
        <div class="head" id="head">
          <div class="haircap"></div>
          <div class="ear left"></div><div class="ear right"></div>
          <div class="jaw" id="jaw"></div>
          <div class="brows" id="brows">
            <div class="brow" id="browL"></div>
            <div class="brow" id="browR"></div>
          </div>
          <div class="eyes">
            <div class="eye" id="eyeL">
              <div class="pupil" id="pupilL"></div>
              <div class="eyelid" id="lidL"></div>
            </div>
            <div class="eye" id="eyeR">
              <div class="pupil" id="pupilR"></div>
              <div class="eyelid" id="lidR"></div>
            </div>
          </div>
          <div class="cheeks"><div class="cheek"></div><div class="cheek"></div></div>
          <div class="nose" id="nose"></div>
          <div class="mouth" id="mouth"><div class="mouth-inner" id="mouthInner"><div class="teeth"></div><div class="tongue" id="tongue"></div></div></div>
          <div class="fx-tear" id="fxTear"></div><div class="fx-sweat" id="fxSweat"></div><div class="fx-puff" id="fxPuff">💢</div>
        </div>
      </div>
      </div>
      <div class="chem-trail">THE MAX &amp; MIA SHOW</div>
    </div>
    <div class="status" id="status">idle • blinking</div>
    <div class="voice-bar" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center">
      <label style="font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #1a1a1a;border-radius:999px;padding:4px 10px;box-shadow:3px 3px 0 #1a1a1a"><input type="checkbox" id="ttsToggle" checked/> 🔊 Voice</label>
      <span style="font-size:12px;font-weight:800;border:2px solid #1a1a1a;border-radius:999px;padding:6px 10px;box-shadow:3px 3px 0 #1a1a1a;background:#fff">⚡ Liam + Jessica — ElevenLabs</span>
    </div>
  </div>

  <div class="chat">
    <div class="topbar">
      <span class="topbar-title">CHAT</span>
      <span style="display:flex;gap:6px;align-items:center">
      <button id="banterBtn" title="Improv: cast riffs on a stage direction">🎲</button>
      <select id="modelSel" title="Switch AI brain">
        <option value="nemotron">Nemotron 3.5 · OpenRouter ⚡</option>
        <option value="qwen">Qwen3.7 Flash · OpenRouter ⚡</option>
        <option value="zen">Muse Spark 1.3 · Zen</option>
      </select>
      </span>
    </div>
    <div class="log" id="log"></div>
    <div class="row">
      <input id="input" placeholder="Say something to your character..." autocomplete="off" maxlength="2000"/>
      <button id="send">SEND</button>
    </div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
